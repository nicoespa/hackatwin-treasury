# Synthetic user population for the simulator. Amounts are ARS at the start of
# the simulation (drifted by SimParams.inflation_monthly); rates are expected
# events per adopting user per day before seasonality and the macro factor.
# Each product: adoption (share of the segment that uses it), base_rate_per_day,
# amount_median and amount_sigma (lognormal). bills_mean is the Poisson mean of
# recurring bills per user (capped at 6).

