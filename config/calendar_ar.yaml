# Argentine business calendar. Methods refuse dates outside `coverage`.
#
# holidays: Ley 27.399 feriados (fixed and movable) plus the Res. 164/2025
# "días no laborables con fines turísticos" (puentes) for 2026, and the
# 2025-11-21 puente (Decreto 1027/2024). Movable dates (Güemes, Paso a la
# Inmortalidad de San Martín, Diversidad Cultural, Soberanía Nacional) follow
# the official decree of each year. 2025 lists only dates from 2025-11-01 onward.
coverage: {start: 2025-11-01, end: 2026-12-31}

holidays:
  - 2025-11-21  # Puente turístico (Decreto 1027/2024)
  - 2025-11-24  # Soberanía Nacional (moved to Monday, Decreto 1027/2024)
  - 2025-12-08  # Inmaculada Concepción
  - 2025-12-25  # Navidad
  - 2026-01-01  # Año Nuevo
  - 2026-02-16  # Carnaval
  - 2026-02-17  # Carnaval
  - 2026-03-23  # Puente (Res. 164/2025)
  - 2026-03-24  # Día de la Memoria
  - 2026-04-02  # Malvinas
  - 2026-04-03  # Viernes Santo
  - 2026-05-01  # Día del Trabajador
  - 2026-05-25  # Revolución de Mayo
  - 2026-06-15  # Güemes (moved to Monday)
  - 2026-06-20  # Belgrano
  - 2026-07-09  # Independencia
  - 2026-07-10  # Puente (Res. 164/2025)
  - 2026-08-17  # San Martín
  - 2026-10-12  # Diversidad Cultural
  - 2026-11-23  # Soberanía Nacional (moved)
  - 2026-12-07  # Puente (Res. 164/2025)
  - 2026-12-08  # Inmaculada Concepción
  - 2026-12-25  # Navidad

# SAC (aguinaldo) payment windows, inclusive.
sac_windows:
  - {start: 2025-12-12, end: 2025-12-24}
  - {start: 2026-06-24, end: 2026-07-06}
  - {start: 2026-12-12, end: 2026-12-24}

# ANSES payment windows, inclusive. Default hypothesis: payments fall on the
# business days between the 9th and the 25th of each month.
anses_windows:
  - {start: 2025-11-09, end: 2025-11-25}
  - {start: 2025-12-09, end: 2025-12-25}
  - {start: 2026-01-09, end: 2026-01-25}
  - {start: 2026-02-09, end: 2026-02-25}
  - {start: 2026-03-09, end: 2026-03-25}
  - {start: 2026-04-09, end: 2026-04-25}
  - {start: 2026-05-09, end: 2026-05-25}
  - {start: 2026-06-09, end: 2026-06-25}
  - {start: 2026-07-09, end: 2026-07-25}
  - {start: 2026-08-09, end: 2026-08-25}
  - {start: 2026-09-09, end: 2026-09-25}
  - {start: 2026-10-09, end: 2026-10-25}
  - {start: 2026-11-09, end: 2026-11-25}
  - {start: 2026-12-09, end: 2026-12-25}
