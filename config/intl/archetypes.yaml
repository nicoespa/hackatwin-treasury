# International population: Argentine wallet users of the cross-border products. Amounts are in
# the currency of the partner that settles the product (pix_brazil in BRL, the rest in USD), at
# the start of the simulation (drifted by market.yaml amount_inflation_monthly). Rates are
# expected events per adopting user per day before seasonality, FX demand and the macro factor.
# Each product: adoption (share of the segment that uses it), base_rate_per_day, amount_median
# and amount_sigma (lognormal). bills_mean is the Poisson mean of recurring payments per user.
# Every share, rate and amount below is an assumption (marked "guess" where no source backs it).

# Recurring payments are card-on-file subscriptions charged as intl_card on a fixed day of the
# month for a fixed amount: all confirmed (known ahead), due on day 1..28.
recurring: {product: intl_card, due_day_max: 28, autodebit_share: 1.0}
# Remitters send money near their payday (business day 1..4 of the month, payday hypothesis).
payday: {segments: [remitter], products: [remittance_out]}

hour_profiles:
  pix_brazil:       [2, 1, 1, 1, 1, 1, 1, 2, 4, 6, 8, 10, 13, 13, 10, 8, 8, 9, 10, 12, 13, 12, 8, 4]   # meals and shopping
  intl_card:        [3, 2, 2, 2, 2, 2, 2, 3, 5, 6, 7, 8, 9, 9, 8, 8, 8, 8, 9, 10, 11, 10, 8, 5]
  intl_card_refund: [1, 1, 1, 1, 1, 1, 2, 4, 8, 10, 11, 11, 10, 10, 10, 9, 8, 7, 5, 4, 3, 2, 2, 1]
  remittance_out:   [1, 1, 1, 1, 1, 1, 2, 3, 6, 10, 12, 12, 11, 11, 11, 11, 10, 8, 6, 5, 4, 3, 2, 1]
  usd_income:       [1, 1, 1, 1, 1, 1, 1, 1, 2, 4, 8, 12, 14, 14, 14, 13, 12, 10, 8, 5, 3, 2, 1, 1]   # US business hours

dow_mult:  # Monday..Sunday
  pix_brazil:       [0.90, 0.90, 0.95, 1.00, 1.10, 1.20, 1.10]  # tourists spend more on weekends (guess)
  intl_card:        [1.00, 1.00, 1.00, 1.00, 1.05, 1.00, 0.95]
  intl_card_refund: [1.05, 1.00, 1.00, 1.00, 1.00, 0.95, 0.85]
  remittance_out:   [1.00, 1.00, 1.00, 1.00, 1.10, 0.90, 0.80]
  usd_income:       [1.20, 1.20, 1.20, 1.20, 1.20, 0.05, 0.05]  # platforms pay out on US business days

archetypes:
  brazil_traveler:          # travels to Brazil several times a year, pays with Pix QR there
    share: 0.20             # guess
    bills_mean: 0.5         # a streaming subscription or two
    bills_amount_median: 12 # USD per subscription (Netflix/Spotify range)
    bills_amount_sigma: 0.4
    products:
      pix_brazil:       {adoption: 0.90, base_rate_per_day: 0.20,  amount_median: 70,  amount_sigma: 0.9}  # BRL per QR payment (meals, shops)
      intl_card:        {adoption: 0.60, base_rate_per_day: 0.03,  amount_median: 80,  amount_sigma: 1.0}  # USD: flights, hotels, bookings
      intl_card_refund: {adoption: 0.60, base_rate_per_day: 0.003, amount_median: 60,  amount_sigma: 0.9}
  digital_subscriber:       # many small recurring USD charges plus app stores and e-commerce
    share: 0.30             # guess: the most common cross-border user
    bills_mean: 2.5         # subscriptions per user (streaming, cloud, AI tools)
    bills_amount_median: 11
    bills_amount_sigma: 0.5
    products:
      intl_card:        {adoption: 0.95, base_rate_per_day: 0.08,  amount_median: 25,  amount_sigma: 0.9}  # USD e-commerce, app stores
      intl_card_refund: {adoption: 0.95, base_rate_per_day: 0.005, amount_median: 20,  amount_sigma: 0.8}
      pix_brazil:       {adoption: 0.15, base_rate_per_day: 0.02,  amount_median: 60,  amount_sigma: 0.9}
  remitter:                 # sends USD to family abroad, mostly right after payday
    share: 0.12             # guess
    bills_mean: 0.0
    products:
      remittance_out:   {adoption: 1.00, base_rate_per_day: 0.06,  amount_median: 250, amount_sigma: 0.6}  # USD per transfer (guess)
      intl_card:        {adoption: 0.40, base_rate_per_day: 0.03,  amount_median: 30,  amount_sigma: 0.9}
      intl_card_refund: {adoption: 0.40, base_rate_per_day: 0.002, amount_median: 25,  amount_sigma: 0.8}
  freelancer_usd:           # paid in USD by foreign clients and platforms, collected at the US partner
    share: 0.10             # guess
    bills_mean: 1.5         # software subscriptions
    bills_amount_median: 20
    bills_amount_sigma: 0.6
    products:
      usd_income:       {adoption: 1.00, base_rate_per_day: 0.02,  amount_median: 600, amount_sigma: 0.7}  # USD per payout, ~0.6 payouts a month (guess)
      intl_card:        {adoption: 0.90, base_rate_per_day: 0.10,  amount_median: 40,  amount_sigma: 1.0}
      intl_card_refund: {adoption: 0.90, base_rate_per_day: 0.006, amount_median: 30,  amount_sigma: 0.9}
      remittance_out:   {adoption: 0.20, base_rate_per_day: 0.02,  amount_median: 300, amount_sigma: 0.7}
      pix_brazil:       {adoption: 0.30, base_rate_per_day: 0.05,  amount_median: 80,  amount_sigma: 0.9}
  occasional:               # uses a cross-border product now and then
    share: 0.28             # guess
    bills_mean: 0.3
    bills_amount_median: 10
    bills_amount_sigma: 0.4
    products:
      intl_card:        {adoption: 0.50, base_rate_per_day: 0.02,  amount_median: 30,  amount_sigma: 1.0}
      intl_card_refund: {adoption: 0.50, base_rate_per_day: 0.002, amount_median: 25,  amount_sigma: 0.9}
      pix_brazil:       {adoption: 0.25, base_rate_per_day: 0.02,  amount_median: 60,  amount_sigma: 0.9}
      remittance_out:   {adoption: 0.03, base_rate_per_day: 0.01,  amount_median: 200, amount_sigma: 0.7}
