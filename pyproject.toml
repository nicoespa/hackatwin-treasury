[project]
name = "treasury"
version = "0.1.0"
description = "Predictive treasury: sizes prefunded balances at a fintech's partners."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "lightgbm",
    "pyyaml",
    "typer",
    "scikit-learn>=1.9.1",
    "anthropic>=2.3.0",
]

[project.scripts]
treasury = "treasury.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treasury"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: full-size experiment runs (several minutes); run with -m slow"]
