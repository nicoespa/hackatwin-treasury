[project]
name = "treasury"
version = "0.1.0"
description = "Predictive treasury: sizes prefunded balances at a fintech's partners."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "lightgbm",
    "pyyaml",
    "typer",
    "scikit-learn>=1.9.1",
    "anthropic>=2.3.0",
    "streamlit>=1.66.1",
    "plotly>=7.1.0",
    "mcp>=1.10",
]

[project.scripts]
treasury = "treasury.cli:app"
treasury-mcp = "treasury.mcp_server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treasury"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-size experiment runs (about 20 s together); informational, they run by default"]
